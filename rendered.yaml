---
# Source: microservice/templates/service.yaml
apiVersion: v1
kind: Service

metadata:
  name: app1

spec:

  type: ClusterIP

  selector:
    app: app1

  ports:

  - port: 8080

    targetPort: 8080
    
---
# Source: microservice/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1
  labels:
    app: app1

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app1

  template:
    metadata:
      labels:
        app: app1

    spec:
      containers:
        - name: app

          image: "celeguim/jvminfo:v3"

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              
---
# Source: microservice/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: app1

spec:

  minReplicas: 2

  maxReplicas: 5

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: app1

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 70
