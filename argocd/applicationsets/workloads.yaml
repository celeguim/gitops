apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads-uat
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://git.example.com/platform/gitops.git
              revision: uat
              files:
                - path: clusters/*/*.yaml
          - clusters:
              selector:
                matchLabels:
                  environment: uat
                  cluster-id: '{{ .clusterId }}'
  template:
    metadata:
      name: '{{ .app }}-{{ .clusterId }}'
      namespace: argocd
      labels:
        environment: uat
        cluster-id: '{{ .clusterId }}'
        application: '{{ .app }}'
    spec:
      project: uat
      source:
        repoURL: https://git.example.com/platform/gitops.git
        targetRevision: uat
        path: '{{ .path }}'
      destination:
        name: '{{ .name }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
      revisionHistoryLimit: 10
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
