apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: exp-006-test
  namespace: argocd
spec:
  goTemplate: true

  generators:
    - git:
        repoURL: https://github.com/celeguim/gitops.git
        revision: HEAD
        files:
          - path: "environments/*.yaml"
    - git:
        repoURL: https://github.com/celeguim/gitops.git
        revision: HEAD
        files:
          - path: "applications/*.yaml"

  template:
    metadata:
      # name: "{{ .name }}"
      # name: "{{ .envName }}--{{ .application.name }}--{{ .application.appName }}"
      name: "{{ .envName }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/celeguim/gitops.git
        targetRevision: HEAD
        path: applications/jvminfo
      destination:
        server: https://kubernetes.default.svc
        namespace: default
