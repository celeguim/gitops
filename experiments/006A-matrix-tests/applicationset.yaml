apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: exp-005-cluster-generator
  namespace: argocd

spec:
  goTemplate: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/celeguim/gitops.git
              revision: HEAD
              files:
                - path: applications/*.yaml

          - git:
              repoURL: https://github.com/celeguim/gitops.git
              revision: HEAD
              files:
                - path: environments/*.yaml
                
  template:
    metadata:
      name: "{{ .name }}-{{ .environmentName }}"

    spec:
      project: default

      source:
        repoURL: https://github.com/celeguim/gitops.git
        targetRevision: HEAD
        path: applications/jvminfo

      destination:
        server: https://kubernetes.default.svc
        namespace: default
        