apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: exp-006-environment-generator
  namespace: argocd

spec:
  goTemplate: true

  generators:
    - git:
        repoURL: https://github.com/celeguim/gitops.git
        revision: HEAD
        files:
          - path: environments/*.yaml

  template:
    metadata:
      name: "{{ .name }}"

    spec:
      project: "{{ .project }}"

      source:
        repoURL: https://github.com/celeguim/gitops.git
        targetRevision: "{{ .targetRevision }}"
        path: applications/jvminfo

      destination:
        server: https://kubernetes.default.svc
        namespace: default
        