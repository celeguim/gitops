apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: exp-005-cluster-generator
  namespace: argocd

spec:
  goTemplate: true

  generators:
    - matrix:
        generators:
          - matrix:
              generators:
          - git:
              repoURL: https://github.com/celeguim/gitops.git
              revision: HEAD
              files:
                - path: experiments/005-cluster-generator/data/*.yaml
          - git:
              repoURL: https://github.com/celeguim/gitops.git
              revision: HEAD
              files:
                - path: experiments/005-cluster-generator/data/*.yaml

          - clusters: {}

  template:
    metadata:
      name: "{{ .appName }}-{{ .name }}"

    spec:
      project: default

      source:
        repoURL: https://github.com/celeguim/gitops.git
        targetRevision: HEAD
        path: "{{ .application.sourcePath }}"

      destination:
        server: "{{ .server }}"
        namespace: default
