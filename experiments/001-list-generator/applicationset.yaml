apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: exp-001-list-generator
  namespace: argocd

spec:
  goTemplate: true

  generators:
    - list:
        elements:
          - name: Experiment-001
            namespace: default
            sourcePath: applications/jvminfo

  template:
    metadata:
      name: "{{ .name }}"

    spec:
      project: default

      source:
        repoURL: https://github.com/celeguim/gitops.git
        targetRevision: HEAD
        path: "{{ .sourcePath }}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
