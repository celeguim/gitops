apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: poc-git-generator
  namespace: argocd

spec:
  goTemplate: true

  generators:
    - git:
        repoURL: https://github.com/celeguim/gitops.git
        revision: HEAD
        directories:
          - path: experiments/git-files/*.yaml

  template:
    metadata:
      name: "{{ .name }}"

    spec:
      destination:
        namespace: "{{ .namespace }}"

      source:
        path: "{{ .path }}"
