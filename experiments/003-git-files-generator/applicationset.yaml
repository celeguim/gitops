apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: poc-git-generator
  namespace: argocd

spec:
  goTemplate: true

  generators:
    - git:
        repoURL: https://github.com/celeguim/gitops.git
        revision: HEAD
        files:
          - path: experiments/003-git-files-generator/data/*.yaml

  template:
    metadata:
      name: "{{ .name }}"

    spec:
      project: default

      source:
        repoURL: https://github.com/celeguim/gitops.git
        targetRevision: HEAD
        path: "{{ .path }}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
