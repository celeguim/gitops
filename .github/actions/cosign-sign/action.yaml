name: Cosign Sign

inputs:
  image:
    description: Image digest
    required: true

  key:
    description: Signing key
    required: true

runs:
  using: composite

  steps:
    - name: Validate image
      shell: bash
      run: |
        if [[ "${{ inputs.image }}" != *@sha256:* ]]; then
          echo "::error::Image must be referenced by digest"
          exit 1
        fi

        echo "Image: ${{ inputs.image }}"

    - name: Validate key
      shell: bash
      run: |
        if [[ -z "${{ inputs.key }}" ]]; then
          echo "::error::Signing key is required"
          exit 1
        fi

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign image
      shell: bash
      run: |
        cosign sign \
          --yes \
          --key "${{ inputs.key }}" \
          "${{ inputs.image }}"
