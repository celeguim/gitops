apiVersion: v1
kind: Service

metadata:
{{ include "microservice.metadata" . | nindent 2 }}

spec:

  type: {{ .Values.service.type }}

  selector:
    {{ include "microservice.labels" . | nindent 4 }}

  ports:

  - port: {{ .Values.service.port }}

    targetPort: {{ .Values.service.targetPort }}
    