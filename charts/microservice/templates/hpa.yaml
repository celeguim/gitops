apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
{{ include "microservice.metadata" . | nindent 2 }}
    
spec:

  minReplicas: {{ .Values.autoscaling.minReplicas }}

  maxReplicas: {{ .Values.autoscaling.maxReplicas }}

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: {{ .Release.Name }}

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: {{ .Values.autoscaling.cpu.targetUtilization }}
        