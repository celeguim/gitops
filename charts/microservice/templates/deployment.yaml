apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}
  labels:
    {{ include "microservice.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.deployment.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
      containers:
        - name: app

          image: "{{ .Values.deployment.container.image.repository }}:{{ .Values.deployment.container.image.tag }}"

          imagePullPolicy: {{ .Values.deployment.container.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.deployment.container.ports.http.containerPort }}
              protocol: TCP

          {{- with .Values.deployment.container.ports.management }}
            - name: management
              containerPort: {{ .containerPort }}
              protocol: TCP
          {{- end }}

          resources:
{{ toYaml .Values.deployment.container.resources | indent 12 }}

          {{- if .Values.deployment.container.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.deployment.container.probes.readiness.path }}
              port: {{ .Values.deployment.container.probes.readiness.port }}
          {{- end }}

          {{- if .Values.deployment.container.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.deployment.container.probes.liveness.path }}
              port: {{ .Values.deployment.container.probes.liveness.port }}
          {{- end }}
