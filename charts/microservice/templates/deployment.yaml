apiVersion: apps/v1
kind: Deployment

metadata:
{{ include "microservice.metadata" . | nindent 2 }}

spec:
  replicas: {{ .Values.deployment.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
      containers:
      {{ include "microservice.container" (dict
          "root" .
          "container" .Values.deployment.container
      ) | nindent 8 }}
